# Overworld generator line (10 tiers) - place-able only in the Overworld.
# Tier 10 (golden_apple_generator) needs 5x Shard Of Nether to upgrade into
# the first Nether tier (netherwart_generator, see nether_generators.yml) -
# since that generator can't be placed in the Overworld, upgrading it there
# gives the item straight to the player's inventory instead of placing it.

ow_wheat_generator:
  display-name: "&e&lWheat Generator"
  world-type: OVERWORLD
  interval: 20
  corrupted:
    enabled: true
    cost: 12.5
    chance: 0.25
  upgrade:
    next-generator: ow_carrot_generator
    upgrade-cost: 50
    require-level: 3
    reduce-level: 1
    require-prestige: 1
    shard-cost:
      greenland: 1
  item:
    material: HAY_BLOCK
    display-name: "&e&lWheat Generator"
    enchantments: [ ]
    flags: [ ]
    custom-model-data: 0
    lore:
      - "&8Purchasable Generator"
      - "&7"
      - "&e&lINFO"
      - "&8Time: &f20 seconds"
      - "&8Generator Tier: &f1"
      - "&8Corruption Chance: &f0.25%"
      - "&a&lUpgrade Cost: &a&n$50"
      - "&c&lReparation Cost: &c&n$12.5"
      - "&7"
      - "&e&lPossible Drops"
      - "&7&eWheat &8(value: &a$8&8)"
      - "&7&eCondensed Wheat &8(value: &a$16&8)"
      - "&7"
      - "&7&oPlace down to activate the generator"
  drops:
    '0':
      chance: 85
      sell-value: 8
      exp: 1.5
      commands: [ ]
      item:
        material: WHEAT
        display-name: "&eWheat &a(/sell for money)"
        enchantments: [ ]
        flags: [ ]
        custom-model-data: 0
        lore:
          - "&8Generator Drop - Overworld Tier 1"
          - "&7"
          - "&7Use &a/sell &7to sell this for &a&n$8"
    '1':
      chance: 15
      sell-value: 16
