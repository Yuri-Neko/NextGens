# Nether generator line (10 tiers) - place-able only in the Nether.
# EVERY upgrade within this line also costs Shard Of Nether (2-5x,
# increasing per tier) on top of the money cost - not just the initial
# crossover from the Overworld. Tier 10 (netherite_generator) needs 5x
# Shard Of The End to upgrade into the first End tier (chorusfruit_generator,
# see end_generators.yml).

nt_netherwart_generator:
  display-name: "&4&lNether Wart Generator"
  world-type: NETHER
  interval: 20
  corrupted:
    enabled: true
    cost: 85
    chance: 0.28
  upgrade:
    next-generator: nt_soulsand_generator
    upgrade-cost: 150000
    shard-cost:
      nether: 2
  item:
    material: NETHER_WART
    display-name: "&4&lNether Wart Generator"
    enchantments: [ ]
    flags: [ ]
    custom-model-data: 0
    lore:
      - "&8Nether Generator - Tier 1"
      - "&7"
      - "&7&oPlace down to activate the generator"
  drops:
    '0':
      chance: 100
      sell-value: 450
      commands: [ ]
      item:
        material: NETHER_WART
        display-name: "&4Nether Wart &a(/sell for money)"
        enchantments: [ ]
        flags: [ ]
        custom-model-data: 0
        lore:
          - "&8Generator Drop - Nether Tier 1"
          - "&7"
          - "&7Use &a/sell &7to sell this for &a&n$450"

