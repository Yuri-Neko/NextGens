    # =====================================================
    # The 7 events below are "type: CUSTOM" - NextGens itself does nothing
    # special with them (no built-in sell/speed/upgrade/drop effect), they
    # just exist as a normal timed/random event. NextEventExtended (an addon
    # plugin) is what gives them an actual effect, by matching their ID here
    # to the SAME ID under "custom-events" in NextEventExtended's own
    # config.yml. These 7 match NextEventExtended's own documented examples
    # exactly - install it and they work immediately, no extra setup needed.
    # =====================================================
